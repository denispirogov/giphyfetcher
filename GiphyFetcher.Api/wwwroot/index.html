<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Giphy Fetcher UI</title>

    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<div class="container">

    <h1>Giphy Fetcher UI</h1>

    <div class="search">
        <input
                id="searchInput"
                type="text"
                placeholder="Search GIFs..."
        />

        <button id="searchButton">
            Search
        </button>
    </div>

    <div class="actions">
        <button id="trendingButton">
            Trending Today
        </button>
    </div>

    <div id="status"></div>

    <div id="gifGrid" class="gif-grid"></div>

</div>

<script src="/js/app.js"></script>

</body>
</html>
